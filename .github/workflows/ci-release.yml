name: CI and release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os != 'Linux'
      - run: npm test
      - run: npm run typecheck

  package:
    name: Package (dist tarball)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: []
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compile the CLI
        run: npm run build
      - name: Smoke-test every subcommand
        # A broken entrypoint must fail here, not at the target. `run`/`ssrf run`
        # only print usage without a target, so this needs no browser.
        run: |
          set -e
          node dist/cli/commands/main.js payloads --context=html --max=1 | head -5
          node dist/cli/commands/main.js ssrf | head -1
          node dist/cli/commands/main.js run | head -1
      - name: Assemble the release tarball
        # Not a pkg single-file binary: Playwright reads browser metadata and uses
        # the inspector from node_modules at runtime, and a pkg snapshot has
        # neither (ERR_INSPECTOR_NOT_AVAILABLE). The tarball keeps Playwright
        # resolvable and runs on any arch with Node 24.
        run: |
          set -e
          mkdir -p release/enigma
          cp -r dist package.json package-lock.json README.md release/enigma/
          tar -czf "release/enigma-${GITHUB_REF_NAME#v}.tar.gz" -C release enigma
      - uses: actions/upload-artifact@v4
        with:
          name: enigma-dist
          path: release/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
