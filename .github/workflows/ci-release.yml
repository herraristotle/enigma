name: CI and release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os != 'Linux'
      - run: npm test
      - run: npm run typecheck

  package:
    name: Package (${{ matrix.asset }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: []
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: node24-win-x64
            asset: enigma-win-x64.exe
          - os: ubuntu-latest
            target: node24-linux-x64
            asset: enigma-linux-x64
          - os: macos-latest
            target: node24-macos-x64
            asset: enigma-macos-x64
          - os: macos-latest
            target: node24-macos-arm64
            asset: enigma-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build standalone executable
        run: npx --yes @yao-pkg/pkg@6.23.0 cli/commands/run.ts --targets ${{ matrix.target }} --output dist/${{ matrix.asset }}
      - name: Smoke-test executable
        shell: bash
        run: ./dist/${{ matrix.asset }} --help || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
