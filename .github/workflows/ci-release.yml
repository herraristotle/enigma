name: CI and release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os != 'Linux'
      - run: npm test
      - run: npm run typecheck

  package:
    name: Package (npm tarball)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: []
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compile the CLI
        run: npm run build
      - name: Smoke-test every subcommand
        # A broken entrypoint must fail here, not at the target.
        run: |
          set -e
          node dist/cli/commands/main.js payloads --context=html --max=1 | head -5
          node dist/cli/commands/main.js ssrf | head -1
          node dist/cli/commands/main.js run | head -1

      # ---------------------------------------------------------------------
      # Why a tarball and not a single-file binary: the runner drives Playwright,
      # which resolves JS by runtime path and needs browsers.json. A @yao-pkg/pkg
      # snapshot cannot host it (ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING, missing
      # browsers.json) and a bun --compile bundle only finds playwright when
      # node_modules sits beside the binary. npm i -g installs the tarball's
      # dependencies from the registry and links the bin — nothing to stage.
      # ---------------------------------------------------------------------
      - name: Gate — Playwright launches from the package
        run: |
          set -e
          npx playwright install --with-deps chromium
          node -e '
            (async () => {
              const { chromium } = require("playwright");
              const browser = await chromium.launch({ headless: true }).catch(() => null);
              if (!browser) { console.error("playwright launch failed"); process.exit(1); }
              const page = await browser.newPage();
              let fired = false;
              page.on("dialog", async (d) => { fired = true; await d.dismiss(); });
              await page.goto("data:text/html,<script>alert(1)</script>").catch(() => {});
              await page.waitForTimeout(500);
              await browser.close();
              if (!fired) { console.error("alert dialog never fired"); process.exit(1); }
              console.log("playwright alert confirmation ok");
            })().catch((e) => { console.error(e); process.exit(1); });
          '

      - name: Pack
        run: mkdir -p release && npm pack --pack-destination release

      # Parity with the only real consumer (Artex): install the packed tarball
      # globally, then launch a browser from THAT tree. This catches a bad
      # `files` allowlist or a dependency missing from `dependencies`, both of
      # which used to ship silently.
      - name: Gate — global install of the tarball runs and drives a browser
        run: |
          set -e
          PREFIX="$(mktemp -d)"
          npm install -g --prefix "$PREFIX" ./release/*.tgz
          ROOT="$PREFIX/lib/node_modules/@mastermind/enigma"
          "$PREFIX/bin/enigma" payloads --context=html --max=1 >/dev/null
          "$PREFIX/bin/enigma" ssrf | head -1
          node -e "
            const path = require('path'), fs = require('fs');
            const root = '$ROOT';
            fs.accessSync(path.join(root, 'dist/cli/commands/main.js'));
            (async () => {
              const { chromium } = require(path.join(root, 'node_modules/playwright'));
              const browser = await chromium.launch({ headless: true }).catch(() => null);
              if (!browser) { console.error('installed copy cannot launch a browser'); process.exit(1); }
              await browser.close();
              console.log('installed copy launches a browser');
            })().catch((e) => { console.error(e); process.exit(1); });
          "

      - uses: actions/upload-artifact@v4
        with:
          name: enigma-tarball
          path: release/*.tgz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
