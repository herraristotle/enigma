name: CI and release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # puppeteer-core bundles no browser: the adapter needs one on the runner.
      # Ubuntu: apt chromium. macOS: the preinstalled Google Chrome. Windows: the
      # preinstalled Chrome/Edge. CHROME_PATH is what the adapter reads.
      - run: sudo apt-get update && sudo apt-get install -y chromium
        if: runner.os == 'Linux'
      - run: echo "CHROME_PATH=$(command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
        if: runner.os == 'Linux'
      - run: echo "CHROME_PATH=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"
        if: runner.os == 'macOS'
      - run: echo "CHROME_PATH=C:\Program Files\Google\Chrome\Application\chrome.exe" >> "$env:GITHUB_ENV"
        if: runner.os == 'Windows'
        shell: pwsh
      - run: npm test
      - run: npm run typecheck

  package:
    name: Package (npm tarball)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: []
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compile the CLI
        run: npm run build
      - name: Smoke-test every subcommand
        # A broken entrypoint must fail here, not at the target.
        run: |
          set -e
          node dist/cli/commands/main.js payloads --context=html --max=1 | head -5
          node dist/cli/commands/main.js ssrf | head -1
          node dist/cli/commands/main.js run | head -1

      # ---------------------------------------------------------------------
      # The browser is puppeteer-core + a system Chromium: it never downloads a
      # ~400MB browser of its own, and the adapter reads CHROME_PATH.
      # ---------------------------------------------------------------------
      - name: Gate — browser launches and fires a dialog
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y chromium
          # Two things: export for THIS step (GITHUB_ENV only affects later
          # steps), and GITHUB_ENV so the global-install gate below inherits it.
          export CHROME_PATH="$(command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          node -e '
            (async () => {
              const puppeteer = require("puppeteer-core");
              const browser = await puppeteer.launch({
                executablePath: process.env.CHROME_PATH,
                headless: true,
                args: ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage"],
              }).catch((e) => { console.error("launch failed:", e.message); return null; });
              if (!browser) process.exit(1);
              const page = await browser.newPage();
              let fired = false;
              page.on("dialog", async (d) => { fired = true; await d.dismiss(); });
              await page.goto("data:text/html,<script>alert(1)</script>").catch(() => {});
              await new Promise((r) => setTimeout(r, 500));
              await browser.close();
              if (!fired) { console.error("alert dialog never fired"); process.exit(1); }
              console.log("alert confirmation ok");
            })().catch((e) => { console.error(e); process.exit(1); });
          '

      - name: Pack
        # npm names the file after the package (scope stripped):
        # @mastermind/enigma -> mastermind-enigma-<ver>.tgz. The release asset is
        # named enigma-<ver>.tgz instead; `npm install -g <url>` reads the package
        # name from inside the tarball, so the filename is free to be the tool name.
        run: |
          mkdir -p release
          npm pack --pack-destination release
          mv release/*.tgz "release/enigma-${GITHUB_REF_NAME#v}.tgz"

      # Parity with the only real consumer (Artex): install the packed tarball
      # globally, then launch a browser from THAT tree. This catches a bad
      # `files` allowlist or a dependency missing from `dependencies`, both of
      # which used to ship silently.
      - name: Gate — global install of the tarball runs and drives a browser
        run: |
          set -e
          PREFIX="$(mktemp -d)"
          npm install -g --prefix "$PREFIX" ./release/*.tgz
          ROOT="$PREFIX/lib/node_modules/@mastermind/enigma"
          "$PREFIX/bin/enigma" payloads --context=html --max=1 >/dev/null
          "$PREFIX/bin/enigma" ssrf | head -1
          node -e "
            const path = require('path'), fs = require('fs');
            const root = '$ROOT';
            fs.accessSync(path.join(root, 'dist/cli/commands/main.js'));
            (async () => {
              const puppeteer = require(path.join(root, 'node_modules/puppeteer-core'));
              const browser = await puppeteer.launch({
                executablePath: process.env.CHROME_PATH,
                headless: true,
                args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
              }).catch(() => null);
              if (!browser) { console.error('installed copy cannot launch a browser'); process.exit(1); }
              await browser.close();
              console.log('installed copy launches a browser');
            })().catch((e) => { console.error(e); process.exit(1); });
          "

      - uses: actions/upload-artifact@v4
        with:
          name: enigma-tarball
          path: release/*.tgz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
